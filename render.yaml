services:
  - type: web
    name: job-hunt-os
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
